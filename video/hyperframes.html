<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Folio | Night desk</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #111f29;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      #tour {
        width: 2560px;
        height: 1440px;
        overflow: hidden;
        position: relative;
        color: #eef0dd;
        background: #132630;
      }
      #desk {
        position: absolute;
        inset: 0 auto auto 0;
        width: 1920px;
        height: 1080px;
        transform: scale(1.3333333333);
        transform-origin: top left;
        overflow: hidden;
        background: linear-gradient(116deg, #172d39, #142936 56%, #253f45);
      }
      .wire {
        position: absolute;
        inset: -18% -35%;
        border-radius: 50%;
        border: 2px solid #86b4a130;
        transform: rotate(-25deg);
      }
      .wire + .wire {
        inset: -9% -28%;
      }
      .wire + .wire + .wire {
        inset: 0 -21%;
      }
      header {
        position: absolute;
        top: 23px;
        left: 45px;
        right: 45px;
        height: 48px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font:
          500 16px Consolas,
          monospace;
        letter-spacing: 3px;
        color: #b6d1c5;
      }
      header b {
        font:
          700 31px Georgia,
          serif;
        color: #f6f5e6;
        letter-spacing: -2px;
      }
      #dock {
        width: 242px;
        position: absolute;
        left: 839px;
        top: 726px;
        height: 67px;
        border: 1px solid #769187;
        border-radius: 23px;
        background: #243c46;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      #dock i {
        position: relative;
        background: #95b3a5;
        border-radius: 12px;
        width: 42px;
        height: 42px;
        display: grid;
        place-content: center;
        font:
          700 27px Georgia,
          serif;
        color: #18392e;
        font-style: normal;
      }
      #dock i:first-child,
      #dock i:last-child {
        width: 33px;
        height: 33px;
        background: #526d74;
      }
      .dock-art {
        position: absolute;
        width: 24px;
        height: 17px;
        border-radius: 3px;
        background: #aec3b5;
        left: 6px;
        top: 10px;
      }
      #arrow {
        position: absolute;
        width: 35px;
        height: 44px;
        left: 1090px;
        top: 848px;
        z-index: 4;
      }
      #cover {
        position: absolute;
        inset: 230px 0 auto;
        text-align: center;
      }
      #cover strong {
        display: block;
        font:
          500 162px/1.4 Georgia,
          serif;
        letter-spacing: -9px;
      }
      #cover span {
        font:
          500 23px Consolas,
          monospace;
        letter-spacing: 5px;
        color: #a9cbad;
      }
      #window {
        position: absolute;
        left: 276px;
        top: 75px;
        width: 1368px;
        border-radius: 17px;
        background: #f7faf2;
        overflow: hidden;
        border: 1px solid #566f6c;
        box-shadow: 0 22px 54px #0717217a;
        transform-origin: 50% 68%;
      }
      #bar {
        display: flex;
        height: 30px;
        align-items: center;
        padding-left: 12px;
        gap: 7px;
        background: #dce4df;
        position: relative;
      }
      #bar i {
        width: 11px;
        height: 11px;
        background: #e4776a;
        border-radius: 50%;
      }
      #bar i + i {
        background: #ecc66c;
      }
      #bar i + i + i {
        background: #70b77a;
      }
      #bar b {
        position: absolute;
        inset: 5px 30%;
        text-align: center;
        color: #52625c;
        font:
          600 13px 'Segoe UI',
          sans-serif;
      }
      #glass {
        position: relative;
        height: 854px;
      }
      #glass > * {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      footer {
        position: absolute;
        inset: auto 0 0;
        height: 110px;
        background: #142832;
        border-top: 1px solid #719084;
        display: flex;
        align-items: center;
        padding: 0 48px;
      }
      #captions {
        position: relative;
        flex: 1;
        height: 76px;
      }
      .cue {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        gap: 30px;
      }
      .cue em {
        width: 200px;
        color: #b2ccaa;
        font:
          500 17px Consolas,
          monospace;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .cue strong {
        font:
          500 30px Georgia,
          serif;
      }
      .cue span {
        font:
          400 20px 'Microsoft YaHei',
          'Segoe UI',
          sans-serif;
        color: #bfd2c9;
      }
      .line {
        width: 110px;
        height: 5px;
        background: #3c5657;
      }
      .line b {
        display: block;
        background: #c4d7aa;
        width: 100%;
        height: 100%;
        transform-origin: left;
      }
    </style>
    <script src="assets/gsap.min.js"></script>
  </head>
  <body>
    <div
      id="tour"
      data-composition-id="tour"
      data-start="0"
      data-duration="@DURATION@"
      data-width="2560"
      data-height="1440"
    >
      <div id="desk">
        <div class="wire"></div>
        <div class="wire"></div>
        <div class="wire"></div>
        <header><b>folio.</b><span>THE NIGHT DESK</span></header>
        <div id="cover">
          <span>PERSONAL INFORMATION LIBRARY</span><strong>Folio.</strong>
        </div>
        <div id="dock">
          <i><span class="dock-art"></span></i><i id="app">f.</i
          ><i><span class="dock-art"></span></i>
        </div>
        <svg id="arrow" viewBox="0 0 30 38">
          <path
            d="M3 2l23 20-12 1-5 11z"
            fill="#14242a"
            stroke="white"
            stroke-width="2"
          />
        </svg>
        <div id="window">
          <div id="bar"><i></i><i></i><i></i><b>Folio</b></div>
          <div id="glass">
            <img id="before" src="assets/opening.png" alt="" /><video
              id="session"
              data-start="@VIDEO_START@"
              data-duration="@VIDEO_LENGTH@"
              data-track-index="1"
              src="assets/continuous.mp4"
              muted
              playsinline
            ></video
            ><img id="after" src="assets/closing.png" alt="" />
          </div>
        </div>
        <footer>
          <div id="captions">@CAPTIONS@</div>
          <div class="line"><b></b></div>
        </footer>
      </div>
      <audio
        id="music"
        src="assets/folio.wav"
        data-start="0"
        data-duration="@DURATION@"
        data-volume="0.82"
        data-track-index="2"
      ></audio>
    </div>
    <script>
      const duration = Number('@DURATION@');
      const tl = gsap.timeline({paused:true});
      window.__timelines = {tour:tl};
      tl.set('#after',{opacity:0},0).set('#session',{opacity:0},0);
      tl.set('#session',{opacity:1},@VIDEO_START@).set('#after',{opacity:1},57);
      tl.fromTo('#arrow',{x:0,y:0},{x:-128,y:-89,ease:'power2.inOut',duration:.8},0);
      tl.to('#app',{scale:1.23,y:-9,duration:.3,yoyo:true,repeat:1},.65);
      tl.to('#arrow,#cover,#dock',{opacity:0,duration:.6},1.1);
      tl.fromTo('#window',{x:0,y:285,scale:.08,opacity:0},{x:0,y:0,scale:1,opacity:1,ease:'power3.inOut',duration:1.95},.83);
      tl.to('#window',{x:175,y:147,scale:1.31,ease:'sine.inOut',duration:1.5},6.4);
      tl.to('#window',{x:0,y:0,scale:1.02,ease:'sine.inOut',duration:1.35},11);
      tl.to('#window',{x:-138,y:11,scale:1.23,ease:'sine.inOut',duration:1.5},24.1);
      tl.to('#window',{x:0,y:2,scale:1,ease:'sine.inOut',duration:1.4},27.25);
      tl.to('#window',{x:-110,y:10,scale:1.2,ease:'sine.inOut',duration:1.3},32.6);
      tl.to('#window',{x:0,y:0,scale:1,ease:'sine.inOut',duration:1.2},39.4);
      tl.to('#window',{x:80,y:62,scale:1.16,ease:'sine.inOut',duration:1.2},41.5);
      tl.to('#window',{x:0,y:0,scale:1,ease:'sine.inOut',duration:1.4},48.7);
      tl.to('#window',{y:248,scale:.12,opacity:0,ease:'power3.inOut',duration:2},57);
      tl.to('#dock,#cover',{opacity:1,duration:1.2},57.9);
      tl.fromTo('.line b',{scaleX:0},{scaleX:1,ease:'none',duration},0);
      /* GENERATED_CAPTIONS */
    </script>
  </body>
</html>
