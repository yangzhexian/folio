name: Folio checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: folio-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.scope.outputs.native }}
      media: ${{ steps.scope.outputs.media }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: scripts/ci-scope.mjs
          sparse-checkout-cone-mode: false
      - id: scope
        run: node scripts/ci-scope.mjs

  core:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run check

  native:
    needs: scope
    if: needs.scope.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Verify a synthetic upgrade on the disposable runner
        shell: pwsh
        run: |
          $previous = Join-Path $env:RUNNER_TEMP 'folio-previous.exe'
          Invoke-WebRequest 'https://github.com/yangzhexian/folio/releases/download/v0.4.3/Folio_0.4.3_x64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous -Algorithm SHA256).Hash -ne '2b111c852c5ee133458565bad75e2889116ee388bbcffcceefc8aa45058215fd') { throw 'Baseline installer checksum mismatch' }
          $candidate = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' -File
          if ($candidate.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          ./scripts/check-upgrade.ps1 -PreviousInstaller $previous -CandidateInstaller $candidate.FullName
      - run: npm run check:native

  media:
    needs: scope
    if: needs.scope.outputs.media == 'true'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            video/package-lock.json
      - run: npm ci
      - run: npm ci --prefix video
      - run: npm run video:check
      - name: Install media probes
        shell: pwsh
        run: |
          if (-not ((Get-Command ffmpeg -ErrorAction SilentlyContinue) -and (Get-Command ffprobe -ErrorAction SilentlyContinue))) {
            choco install ffmpeg -y --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: npm run verify --prefix video
