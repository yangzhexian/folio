<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Folio — Your details. Within reach.</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; color: #203d32; background: #f3f4ed; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: clamp(20px, 5vw, 64px); }
      main { max-width: 1280px; margin: auto; }
      header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 12px 24px; margin-bottom: 24px; }
      h1 { font-size: 38px; letter-spacing: -2px; margin: 0; }
      p { margin: 0; color: #61735f; line-height: 1.6; }
      video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #172d26; border-radius: 12px; box-shadow: 0 18px 56px #203d321b; }
      nav { display: flex; gap: 24px; flex-wrap: wrap; margin: 24px 0 16px; }
      a { color: #416243; text-underline-offset: 4px; }
      a:focus-visible { outline: 2px solid currentColor; outline-offset: 5px; }
      small { color: #61735f; line-height: 1.6; }
      @media (prefers-color-scheme: dark) {
        :root { color-scheme: dark; color: #edf2e6; background: #172d26; }
        p, small { color: #b4c4b3; }
        a { color: #c5d3a5; }
      }
    </style>
  </head>
  <body>
    <main>
      <header><h1>folio.</h1><p>Your details. Within reach.</p></header>
      <video controls playsinline preload="metadata" poster="folio-poster.png" aria-label="Folio product introduction, 60.6 seconds">
        <source src="folio-intro.mp4" type="video/mp4" />
        <track kind="captions" srclang="en" label="English" src="folio-intro.en.vtt" />
        <p><a href="folio-intro.mp4">Download the introduction video.</a></p>
      </video>
      <nav aria-label="Video resources"><a href="folio-intro.mp4" download>Download MP4</a><a href="folio-poster.png">Static poster</a><a href="../roadmap.md">Roadmap</a></nav>
      <small>60.6 seconds, 2560 × 1440, 30 fps. One continuous application session, English titles and Chinese captions, original instrumental soundtrack. All records and attachments shown are fictional.</small>
    </main>
  </body>
</html>
