<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Folio | Product tour</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #f2f0e6; color: #233e33; font: 16px/1.5 system-ui, sans-serif; }
      main { width: min(1180px, 94vw); margin: 4vh auto; }
      h1 { margin: 0 0 1rem; font: 600 clamp(2.2rem, 4vw, 3rem)/1 Georgia, serif; letter-spacing: -0.06em; }
      video { display: block; width: 100%; aspect-ratio: 16/9; background: #213b32; border-radius: 12px; }
      nav { display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem; margin-top: 1rem; }
      a { color: inherit; text-underline-offset: 4px; }
      :focus-visible { outline: 3px solid #995232; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Folio</h1>
      <video controls playsinline preload="metadata" src="folio-intro.mp4" poster="folio-poster.png" aria-label="Folio product tour">
        <track kind="captions" srclang="en" label="English" src="folio-intro.en.vtt" />
        <track kind="captions" srclang="zh" label="中文" src="folio-intro.zh.vtt" />
        <a href="folio-intro.mp4">Watch the film</a>
      </video>
      <nav aria-label="Tour downloads">
        <a href="folio-intro.mp4" download>Download MP4</a>
        <a href="folio-preview.gif">Open full GIF</a>
      </nav>
    </main>
  </body>
</html>
